<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1520" viewBox="0 0 1900 1520" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura completa del backend KarenFlix</title>
  <desc id="description">Diagrama de los clientes, el proceso Node y Express, middlewares, rutas, validadores, controladores, DTO, servicios, modelos, pool de MySQL, configuración, documentación y tablas de datos.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3f607c"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#16806c"/></marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10 0 L0 5 L10 10z" fill="#16806c"/></marker>
    <marker id="arrowSmall" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#788ea0"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #19354b; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #506a7e; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #60788b; }
      .heading { font-size: 20px; font-weight: 700; }
      .path { font-family: Consolas, "Courier New", monospace; font-size: 14px; fill: #526b7d; }
      .body { font-size: 15px; fill: #38556b; }
      .small { font-size: 13px; fill: #526b7d; }
      .tag { font-size: 13px; font-weight: 700; }
      .flow { fill: none; stroke: #3f607c; stroke-width: 3; marker-end: url(#arrow); }
      .exchange { fill: none; stroke: #3f607c; stroke-width: 3; marker-start: url(#arrowGreen); marker-end: url(#arrow); }
      .return { fill: none; stroke: #16806c; stroke-width: 3; marker-end: url(#arrowBack); }
      .support { fill: none; stroke: #788ea0; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowSmall); }
      .card { fill: #fff; stroke: #c2d0da; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1900" height="1520" fill="#f3f7fa"/>
  <text x="70" y="70" class="title">Arquitectura completa de KarenFlix</text>
  <text x="70" y="104" class="subtitle">Componentes del repositorio y recorrido de una solicitud desde el cliente hasta MySQL.</text>

  <text x="70" y="157" class="section">1. CLIENTES Y ENTRADA A LA API</text>

  <!-- Clients -->
  <rect x="70" y="190" width="270" height="260" rx="16" class="card"/>
  <rect x="70" y="190" width="270" height="10" rx="5" fill="#2777a2"/>
  <text x="205" y="235" text-anchor="middle" class="heading">Clientes</text>
  <text x="95" y="275" class="body">Frontend del equipo</text>
  <text x="95" y="301" class="path">karenflix-frontend</text>
  <text x="95" y="342" class="body">Pruebas manuales</text>
  <text x="95" y="368" class="path">bruno/KarenFlix API/</text>
  <line x1="95" y1="390" x2="315" y2="390" stroke="#e2e9ee"/>
  <text x="205" y="418" text-anchor="middle" class="small">HTTP · JSON · cookie / Bearer</text>

  <!-- Express app -->
  <rect x="390" y="190" width="310" height="260" rx="16" class="card"/>
  <rect x="390" y="190" width="310" height="10" rx="5" fill="#b7791f"/>
  <text x="545" y="235" text-anchor="middle" class="heading">Aplicación Express</text>
  <text x="545" y="260" text-anchor="middle" class="path">src/app.js</text>
  <text x="415" y="299" class="body">ID de solicitud y Helmet</text>
  <text x="415" y="325" class="body">CORS y lectura de JSON</text>
  <text x="415" y="351" class="body">Rate limit global y de autenticación</text>
  <text x="415" y="377" class="body">/health · /api/v1 · /api-docs</text>
  <text x="415" y="413" class="small">404 y errores centralizados al final</text>

  <!-- Routing and middleware -->
  <rect x="750" y="190" width="330" height="260" rx="16" class="card"/>
  <rect x="750" y="190" width="330" height="10" rx="5" fill="#7255a0"/>
  <text x="915" y="235" text-anchor="middle" class="heading">Rutas y validación</text>
  <text x="915" y="260" text-anchor="middle" class="path">src/routes/ · src/validators/</text>
  <text x="775" y="299" class="body">auth · categorías · películas</text>
  <text x="775" y="325" class="body">reseñas · ranking</text>
  <text x="775" y="359" class="body">Validación de parámetros y cuerpos</text>
  <text x="775" y="385" class="body">JWT, sesión y roles</text>
  <text x="775" y="417" class="path">middlewares/auth.js · roles.js</text>

  <!-- Controllers -->
  <rect x="1130" y="190" width="310" height="260" rx="16" class="card"/>
  <rect x="1130" y="190" width="310" height="10" rx="5" fill="#25836d"/>
  <text x="1285" y="235" text-anchor="middle" class="heading">Controladores</text>
  <text x="1285" y="260" text-anchor="middle" class="path">src/controllers/</text>
  <text x="1155" y="299" class="body">Reciben req y construyen res</text>
  <text x="1155" y="325" class="body">Llaman al servicio correspondiente</text>
  <text x="1155" y="359" class="body">Convierten errores con next(error)</text>
  <text x="1155" y="393" class="body">Devuelven respuestas HTTP</text>
  <text x="1155" y="411" class="path">auth · categorías · películas</text>
  <text x="1155" y="432" class="path">reseñas · ranking</text>

  <!-- Services -->
  <rect x="1490" y="190" width="340" height="260" rx="16" class="card"/>
  <rect x="1490" y="190" width="340" height="10" rx="5" fill="#2777a2"/>
  <text x="1660" y="235" text-anchor="middle" class="heading">Servicios</text>
  <text x="1660" y="260" text-anchor="middle" class="path">src/services/</text>
  <text x="1515" y="299" class="body">Reglas de autenticación y roles</text>
  <text x="1515" y="325" class="body">Catálogo, actores y categorías</text>
  <text x="1515" y="351" class="body">Reseñas y reacciones</text>
  <text x="1515" y="377" class="body">Ranking y transacciones</text>
  <text x="1515" y="407" class="path">auth · catálogo · categorías</text>
  <text x="1515" y="430" class="path">reseñas · reacciones · ranking</text>

  <!-- Main request arrows -->
  <path d="M340 320 H382" class="exchange"/>
  <path d="M700 320 H742" class="exchange"/>
  <path d="M1080 320 H1122" class="exchange"/>
  <path d="M1440 320 H1482" class="exchange"/>
  <rect x="600" y="466" width="690" height="36" rx="18" fill="#e4edf4"/>
  <text x="945" y="490" text-anchor="middle" class="tag">SOLICITUD → · RESPUESTA ←</text>

  <text x="70" y="552" class="section">2. ACCESO A DATOS Y RESPUESTA</text>

  <!-- Repositories -->
  <rect x="1490" y="580" width="340" height="250" rx="16" class="card"/>
  <rect x="1490" y="580" width="340" height="10" rx="5" fill="#7255a0"/>
  <text x="1660" y="625" text-anchor="middle" class="heading">Modelos / repositorios</text>
  <text x="1660" y="651" text-anchor="middle" class="path">src/models/</text>
  <text x="1515" y="690" class="body">Consultas SQL parametrizadas</text>
  <text x="1515" y="716" class="body">Lecturas, escrituras y transacciones</text>
  <text x="1515" y="750" class="body">usuario · categoría · película</text>
  <text x="1515" y="776" class="body">reseña · reacción · ranking</text>

  <!-- Pool -->
  <rect x="1130" y="580" width="310" height="250" rx="16" class="card"/>
  <rect x="1130" y="580" width="310" height="10" rx="5" fill="#25836d"/>
  <text x="1285" y="625" text-anchor="middle" class="heading">Pool de conexiones</text>
  <text x="1285" y="651" text-anchor="middle" class="path">src/config/db.js</text>
  <text x="1155" y="690" class="body">mysql2/promise</text>
  <text x="1155" y="716" class="body">Conexiones reutilizables</text>
  <text x="1155" y="750" class="body">TLS configurable para producción</text>
  <text x="1155" y="784" class="small">verificarConexion · cerrarConexion</text>

  <!-- Database -->
  <rect x="750" y="580" width="330" height="250" rx="16" class="card"/>
  <rect x="750" y="580" width="330" height="10" rx="5" fill="#b7791f"/>
  <text x="915" y="625" text-anchor="middle" class="heading">MySQL · InnoDB</text>
  <text x="915" y="651" text-anchor="middle" class="path">database/schema.sql</text>
  <text x="775" y="690" class="body">usuarios · categorías · películas</text>
  <text x="775" y="716" class="body">directores · actores · reparto</text>
  <text x="775" y="742" class="body">reseñas · reacciones · favoritos</text>
  <text x="775" y="784" class="small">Claves, índices y relaciones FK</text>

  <!-- services to repos and through data -->
  <path d="M1660 450 V570" class="exchange"/>
  <path d="M1490 705 H1448" class="exchange"/>
  <path d="M1130 705 H1088" class="exchange"/>

  <!-- response return -->
  <rect x="390" y="858" width="1140" height="44" rx="22" fill="#dff2eb"/>
  <text x="960" y="886" text-anchor="middle" class="tag" fill="#126b59">LA RESPUESTA O EL ERROR REGRESA POR LAS MISMAS CAPAS EN ORDEN INVERSO</text>

  <text x="70" y="955" class="section">3. ARCHIVOS DE ARRANQUE Y SERVICIOS COMPARTIDOS</text>

  <!-- Bootstrap -->
  <rect x="70" y="985" width="500" height="285" rx="16" class="card"/>
  <rect x="70" y="985" width="500" height="10" rx="5" fill="#2777a2"/>
  <text x="320" y="1030" text-anchor="middle" class="heading">Arranque del servidor</text>
  <text x="95" y="1070" class="path">package.json</text>
  <text x="235" y="1070" class="body">scripts y dependencias</text>
  <text x="95" y="1105" class="path">src/server.js</text>
  <text x="235" y="1105" class="body">comprueba MySQL y abre el puerto</text>
  <text x="95" y="1140" class="path">src/index.js</text>
  <text x="235" y="1140" class="body">exporta la app para otros entornos</text>
  <text x="95" y="1185" class="body">npm run dev → nodemon src/server.js</text>
  <text x="95" y="1221" class="small">Al cerrar, libera el servidor y el pool de MySQL.</text>

  <!-- Configuration -->
  <rect x="600" y="985" width="650" height="285" rx="16" class="card"/>
  <rect x="600" y="985" width="650" height="10" rx="5" fill="#b7791f"/>
  <text x="925" y="1030" text-anchor="middle" class="heading">Configuración · src/config/</text>
  <text x="630" y="1070" class="path">.env → env.js</text>
  <text x="815" y="1070" class="body">puerto, MySQL, JWT, CORS y TLS</text>
  <text x="630" y="1107" class="path">db.js</text>
  <text x="815" y="1107" class="body">pool compartido para los modelos</text>
  <text x="630" y="1144" class="path">passport.js</text>
  <text x="815" y="1144" class="body">valida JWT de cookie o Bearer</text>
  <text x="630" y="1181" class="path">swagger.js</text>
  <text x="815" y="1181" class="body">publica la documentación en /api-docs</text>
  <text x="630" y="1228" class="small">.env.example se usó como plantilla; .env quedó fuera de Git.</text>

  <!-- Shared modules -->
  <rect x="1280" y="985" width="550" height="320" rx="16" class="card"/>
  <rect x="1280" y="985" width="550" height="10" rx="5" fill="#7255a0"/>
  <text x="1555" y="1030" text-anchor="middle" class="heading">Módulos compartidos</text>
  <text x="1310" y="1070" class="path">src/dtos/ + factories/</text>
  <text x="1310" y="1094" class="body">filtran datos de entrada y respuesta</text>
  <text x="1310" y="1130" class="path">src/utils/</text>
  <text x="1310" y="1154" class="body">errores de aplicación y normalización</text>
  <text x="1310" y="1190" class="path">src/middlewares/</text>
  <text x="1310" y="1214" class="body">autenticación, roles, rate limit, CSRF, validación</text>
  <text x="1310" y="1249" class="small">errorHandler.js entrega el formato común de error.</text>
  <text x="1310" y="1280" class="path">uploads/posters/</text>
  <text x="1455" y="1280" class="small">directorio presente; sin ruta de carga activa</text>

  <!-- Supporting relations -->
  <path d="M320 985 V475 H545 V460" class="support"/>
  <path d="M900 985 V530 H915 V460" class="support"/>
  <path d="M1120 985 V915 H1285 V830" class="support"/>

  <rect x="70" y="1320" width="1760" height="115" rx="16" fill="#e7eef3"/>
  <text x="100" y="1360" class="section">FLUJO RESUMIDO</text>
  <text x="100" y="1397" class="body">Frontend / Bruno → app.js y seguridad → rutas y validación → controladores + DTO → servicios → modelos SQL → pool mysql2 → MySQL</text>
  <text x="100" y="1420" class="small">Las consultas se ejecutan en el servidor. El navegador nunca se conecta directamente a la base de datos.</text>
</svg>
