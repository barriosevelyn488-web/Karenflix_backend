    <text x="502" y="356" text-anchor="middle" class="detail">auth</text>
    <text x="502" y="381" text-anchor="middle" class="detail">categorías · películas</text>
    <text x="502" y="404" text-anchor="middle" class="detail">reseñas · ranking</text>

    <rect x="602" y="210" width="164" height="218" rx="14" fill="#fff" stroke="#b9cad8" stroke-width="2"/>
    <rect x="602" y="210" width="164" height="9" rx="5" fill="#27866d"/>
    <text x="684" y="253" text-anchor="middle" class="card-title">Controladores</text>
    <text x="684" y="284" text-anchor="middle" class="detail">src/controllers/</text>
    <text x="684" y="307" text-anchor="middle" class="detail">Procesan HTTP</text>
    <line x1="626" y1="329" x2="742" y2="329" stroke="#e1e8ee"/>
    <text x="684" y="356" text-anchor="middle" class="detail">Llaman servicios</text>
    <text x="684" y="381" text-anchor="middle" class="detail">Preparan respuesta</text>
    <text x="684" y="404" text-anchor="middle" class="detail">con DTOs</text>

    <rect x="784" y="210" width="164" height="218" rx="14" fill="#fff" stroke="#b9cad8" stroke-width="2"/>
    <rect x="784" y="210" width="164" height="9" rx="5" fill="#2878a5"/>
    <text x="866" y="253" text-anchor="middle" class="card-title">Servicios</text>
    <text x="866" y="284" text-anchor="middle" class="detail">src/services/</text>
    <text x="866" y="307" text-anchor="middle" class="detail">Reglas del sistema</text>
    <line x1="808" y1="329" x2="924" y2="329" stroke="#e1e8ee"/>
    <text x="866" y="356" text-anchor="middle" class="detail">Autenticación</text>
    <text x="866" y="381" text-anchor="middle" class="detail">Catálogo</text>
    <text x="866" y="404" text-anchor="middle" class="detail">Reseñas y ranking</text>

    <rect x="966" y="210" width="164" height="218" rx="14" fill="#fff" stroke="#b9cad8" stroke-width="2"/>
    <rect x="966" y="210" width="164" height="9" rx="5" fill="#7658a5"/>
    <text x="1048" y="253" text-anchor="middle" class="card-title">Modelos</text>
    <text x="1048" y="284" text-anchor="middle" class="detail">Repositorios SQL</text>
    <text x="1048" y="307" text-anchor="middle" class="detail">src/models/</text>
    <line x1="990" y1="329" x2="1106" y2="329" stroke="#e1e8ee"/>
    <text x="1048" y="356" text-anchor="middle" class="detail">Consultas preparadas</text>
    <text x="1048" y="381" text-anchor="middle" class="detail">Lectura y escritura</text>
    <text x="1048" y="404" text-anchor="middle" class="detail">de datos</text>

    <rect x="1148" y="210" width="164" height="218" rx="14" fill="#fff" stroke="#b9cad8" stroke-width="2"/>
    <rect x="1148" y="210" width="164" height="9" rx="5" fill="#27866d"/>
    <text x="1230" y="253" text-anchor="middle" class="card-title">Pool MySQL</text>
    <text x="1230" y="284" text-anchor="middle" class="detail">src/config/db.js</text>
    <text x="1230" y="307" text-anchor="middle" class="detail">Conexiones compartidas</text>
    <line x1="1172" y1="329" x2="1288" y2="329" stroke="#e1e8ee"/>
    <text x="1230" y="356" text-anchor="middle" class="detail">mysql2/promise</text>
    <text x="1230" y="381" text-anchor="middle" class="detail">TLS configurable</text>
    <text x="1230" y="404" text-anchor="middle" class="detail">Transacciones</text>

    <rect x="1330" y="210" width="164" height="218" rx="14" fill="#fff" stroke="#b9cad8" stroke-width="2"/>
    <rect x="1330" y="210" width="164" height="9" rx="5" fill="#b77218"/>
    <text x="1412" y="253" text-anchor="middle" class="card-title">MySQL</text>
    <text x="1412" y="284" text-anchor="middle" class="detail">InnoDB</text>
    <text x="1412" y="307" text-anchor="middle" class="detail">Base karenflix</text>
    <line x1="1354" y1="329" x2="1470" y2="329" stroke="#e1e8ee"/>
    <text x="1412" y="356" text-anchor="middle" class="detail">Usuarios</text>
    <text x="1412" y="381" text-anchor="middle" class="detail">Películas · actores</text>
    <text x="1412" y="404" text-anchor="middle" class="detail">Reseñas · categorías</text>
  </g>

  <path d="M1412 452 V510 H138 V452" fill="none" stroke="#138a72" stroke-width="3" marker-end="url(#arrow-back)"/>
  <rect x="604" y="490" width="392" height="38" rx="19" fill="#e0f3ec"/>
  <text x="800" y="515" text-anchor="middle" class="tag" fill="#126d5b">← RESPUESTA JSON O ERROR</text>

  <rect x="238" y="580" width="164" height="86" rx="12" fill="#fff" stroke="#c6d4df" stroke-width="2"/>
  <text x="320" y="615" text-anchor="middle" class="card-title">Swagger</text>
  <text x="320" y="642" text-anchor="middle" class="detail">/api-docs</text>
  <path d="M320 580 V458 H320 V432" fill="none" stroke="#8b9dad" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <text x="800" y="710" text-anchor="middle" class="subtitle">Las credenciales se leyeron desde .env; el navegador usó credentials: 'include' para enviar la cookie HttpOnly.</text>
</svg>
