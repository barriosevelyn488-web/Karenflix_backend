<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Conexión entre las capas del backend de KarenFlix</title>
  <desc id="description">El frontend o Bruno se comunica por HTTP con Express. La solicitud pasa por seguridad, rutas, controladores, servicios, repositorios y el pool de MySQL. La respuesta vuelve al cliente.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#476581"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#138a72"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #183047; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536a7d; }
      .card-title { font-size: 18px; font-weight: 700; }
      .detail { font-size: 14px; fill: #435c71; }
      .tag { font-size: 13px; font-weight: 600; }
      .edge-label { font-size: 13px; font-weight: 600; fill: #435c71; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f4f7fa"/>
  <text x="64" y="68" class="title">Cómo se conectaron las capas de KarenFlix</text>
  <text x="64" y="101" class="subtitle">Una solicitud entra por la API, llega a MySQL a través de las capas y vuelve con una respuesta JSON.</text>

  <rect x="64" y="132" width="1472" height="34" rx="17" fill="#e4edf4"/>
  <text x="800" y="154" text-anchor="middle" class="tag">SOLICITUD HTTP →</text>

  <g fill="none" stroke="#476581" stroke-width="3" marker-end="url(#arrow)">
    <path d="M220 319 H237"/><path d="M402 319 H419"/><path d="M584 319 H601"/>
    <path d="M766 319 H783"/><path d="M948 319 H965"/><path d="M1130 319 H1147"/>
    <path d="M1312 319 H1329"/>
  </g>

  <g>
    <rect x="56" y="210" width="164" height="218" rx="14" fill="#fff" stroke="#b9cad8" stroke-width="2"/>
    <rect x="56" y="210" width="164" height="9" rx="5" fill="#2878a5"/>
    <text x="138" y="253" text-anchor="middle" class="card-title">Cliente</text>
    <text x="138" y="284" text-anchor="middle" class="detail">Frontend</text>
    <text x="138" y="307" text-anchor="middle" class="detail">o Bruno</text>
    <line x1="80" y1="329" x2="196" y2="329" stroke="#e1e8ee"/>
    <text x="138" y="356" text-anchor="middle" class="tag">HTTP / JSON</text>
    <text x="138" y="381" text-anchor="middle" class="detail">Cookie o Bearer</text>

    <rect x="238" y="210" width="164" height="218" rx="14" fill="#fff" stroke="#b9cad8" stroke-width="2"/>
    <rect x="238" y="210" width="164" height="9" rx="5" fill="#b77218"/>
    <text x="320" y="253" text-anchor="middle" class="card-title">Express</text>
    <text x="320" y="284" text-anchor="middle" class="detail">Seguridad y</text>
    <text x="320" y="307" text-anchor="middle" class="detail">middleware</text>
    <line x1="262" y1="329" x2="378" y2="329" stroke="#e1e8ee"/>
    <text x="320" y="356" text-anchor="middle" class="detail">Helmet · CORS</text>
    <text x="320" y="381" text-anchor="middle" class="detail">Rate limit · JWT</text>
    <text x="320" y="404" text-anchor="middle" class="detail">Validación · CSRF</text>

    <rect x="420" y="210" width="164" height="218" rx="14" fill="#fff" stroke="#b9cad8" stroke-width="2"/>
    <rect x="420" y="210" width="164" height="9" rx="5" fill="#7658a5"/>
    <text x="502" y="253" text-anchor="middle" class="card-title">Rutas</text>
    <text x="502" y="284" text-anchor="middle" class="detail">src/routes/</text>
    <text x="502" y="307" text-anchor="middle" class="detail">Agrupan endpoints</text>
