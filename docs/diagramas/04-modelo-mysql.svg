<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="t d">
  <title id="t">Modelo de datos MySQL de KarenFlix</title>
  <desc id="d">Diagrama relacional de usuarios, categorías, películas, directores, actores, reseñas, reacciones y favoritos.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#58748a"/></marker><style>
    text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#19354b}.title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#536c80}.th{font:700 17px Consolas,"Courier New",monospace;fill:#fff}.field{font:14px Consolas,"Courier New",monospace;fill:#36556b}.small{font-size:13px;fill:#526b7d}.rel{font-size:13px;font-weight:700;fill:#456278}.card{fill:#fff;stroke:#b8c9d6;stroke-width:2}.edge{fill:none;stroke:#58748a;stroke-width:2.5;marker-end:url(#a)}
  </style></defs>
  <rect width="1800" height="1120" fill="#f3f7fa"/>
  <text x="60" y="65" class="title">Modelo relacional de MySQL</text>
  <text x="60" y="98" class="sub">Las claves foráneas enlazaron el catálogo, las cuentas y la actividad de los usuarios.</text>

  <!-- Relationships, drawn behind the tables -->
  <path d="M360 325 H480" class="edge"/><text x="385" y="313" class="rel">1 : N</text>
  <path d="M360 390 H420 V510 H900" class="edge"/><text x="595" y="499" class="rel">1 : N · propone / aprueba</text>
  <path d="M770 185 H825 V310 H900" class="edge"/><text x="791" y="174" class="rel">1 : N</text>
  <path d="M770 390 H850 V390 H900" class="edge"/><text x="803" y="378" class="rel">0..1 : N</text>
  <path d="M1250 320 H1385" class="edge"/><text x="1280" y="307" class="rel">1 : N</text>
  <path d="M1545 275 V320" class="edge"/>
  <path d="M1075 540 V650" class="edge"/><text x="1088" y="613" class="rel">1 : N</text>
  <path d="M360 400 H390 V710 H900" class="edge"/><text x="610" y="699" class="rel">1 : N</text>
  <path d="M1250 735 H1385" class="edge"/><text x="1280" y="723" class="rel">1 : N</text>
  <path d="M360 430 H390 V970 H1360 V740 H1385" class="edge"/><text x="760" y="958" class="rel">1 : N</text>
  <path d="M950 540 V590 H740 V790" class="edge"/><text x="775" y="580" class="rel">1 : N</text>
  <path d="M210 460 V875 H480" class="edge"/><text x="224" y="856" class="rel">1 : N</text>

  <!-- Users -->
  <g><rect x="60" y="255" width="300" height="205" rx="13" class="card"/><path d="M73 255 H347 Q360 255 360 268 V292 H60 V268 Q60 255 73 255" fill="#2777a2"/>
    <text x="80" y="280" class="th">USUARIOS</text><text x="82" y="322" class="field">PK  id</text><text x="82" y="348" class="field">     nombre, email (único)</text><text x="82" y="374" class="field">     password_hash</text><text x="82" y="400" class="field">     rol</text><text x="82" y="433" class="small">Creador de propuestas y reseñas</text></g>

  <!-- Categories -->
  <g><rect x="480" y="100" width="290" height="170" rx="13" class="card"/><path d="M493 100 H757 Q770 100 770 113 V137 H480 V113 Q480 100 493 100" fill="#7255a0"/>
    <text x="500" y="125" class="th">CATEGORIAS</text><text x="502" y="168" class="field">PK  id</text><text x="502" y="194" class="field">     nombre (único)</text><text x="502" y="235" class="small">Una categoría por película</text></g>

  <!-- Directors -->
  <g><rect x="480" y="310" width="290" height="170" rx="13" class="card"/><path d="M493 310 H757 Q770 310 770 323 V347 H480 V323 Q480 310 493 310" fill="#25836d"/>
    <text x="500" y="335" class="th">DIRECTORES</text><text x="502" y="378" class="field">PK  id</text><text x="502" y="404" class="field">     nombre (único)</text><text x="502" y="445" class="small">La relación con película es opcional</text></g>

  <!-- Movies -->
  <g><rect x="900" y="245" width="350" height="295" rx="13" class="card"/><path d="M913 245 H1237 Q1250 245 1250 258 V282 H900 V258 Q900 245 913 245" fill="#b7791f"/>
    <text x="920" y="270" class="th">PELICULAS</text><text x="922" y="312" class="field">PK  id</text><text x="922" y="338" class="field">UQ  titulo_normalizado</text><text x="922" y="364" class="field">FK  categoria_id</text><text x="922" y="390" class="field">FK  director_id (nullable)</text><text x="922" y="416" class="field">FK  creado_por / aprobado_por</text><text x="922" y="442" class="field">     trailer_url, estado</text><text x="922" y="468" class="field">     rating_promedio, total_resenas</text><text x="922" y="510" class="small">Rating y total se recalcularon al cambiar reseñas</text></g>

  <!-- Actors and bridge -->
  <g><rect x="1385" y="100" width="300" height="175" rx="13" class="card"/><path d="M1398 100 H1672 Q1685 100 1685 113 V137 H1385 V113 Q1385 100 1398 100" fill="#2777a2"/>
    <text x="1405" y="125" class="th">ACTORES</text><text x="1407" y="168" class="field">PK  id</text><text x="1407" y="194" class="field">UQ  nombre</text><text x="1407" y="238" class="small">Cada nombre se almacena una vez</text></g>
  <g><rect x="1385" y="320" width="300" height="180" rx="13" class="card"/><path d="M1398 320 H1672 Q1685 320 1685 333 V357 H1385 V333 Q1385 320 1398 320" fill="#7255a0"/>
    <text x="1405" y="345" class="th">PELICULA_ACTOR</text><text x="1407" y="388" class="field">PK, FK  pelicula_id</text><text x="1407" y="414" class="field">PK, FK  actor_id</text><text x="1407" y="460" class="small">Resuelve la relación muchos a muchos</text></g>

  <!-- Reviews -->
  <g><rect x="900" y="650" width="350" height="220" rx="13" class="card"/><path d="M913 650 H1237 Q1250 650 1250 663 V687 H900 V663 Q900 650 913 650" fill="#25836d"/>
    <text x="920" y="675" class="th">RESENAS</text><text x="922" y="718" class="field">PK  id</text><text x="922" y="744" class="field">FK  pelicula_id, usuario_id</text><text x="922" y="770" class="field">     calificacion (1–10)</text><text x="922" y="796" class="field">UQ  pelicula_id + usuario_id</text><text x="922" y="822" class="field">     likes, dislikes (contadores)</text><text x="922" y="851" class="small">Una reseña por usuario y película</text></g>

  <!-- Reactions -->
  <g><rect x="1385" y="650" width="300" height="180" rx="13" class="card"/><path d="M1398 650 H1672 Q1685 650 1685 663 V687 H1385 V663 Q1385 650 1398 650" fill="#b7791f"/>
    <text x="1405" y="675" class="th">REACCIONES</text><text x="1407" y="718" class="field">PK, FK  usuario_id</text><text x="1407" y="744" class="field">PK, FK  resena_id</text><text x="1407" y="770" class="field">     tipo: like / dislike</text><text x="1407" y="810" class="small">Una reacción por usuario y reseña</text></g>

  <!-- Favorites -->
  <g><rect x="480" y="790" width="290" height="160" rx="13" class="card"/><path d="M493 790 H757 Q770 790 770 803 V827 H480 V803 Q480 790 493 790" fill="#2777a2"/>
    <text x="500" y="815" class="th">FAVORITOS</text><text x="502" y="858" class="field">PK, FK  usuario_id</text><text x="502" y="884" class="field">PK, FK  pelicula_id</text><text x="502" y="923" class="small">Relación N:M entre usuarios y películas</text></g>

  <rect x="60" y="995" width="1625" height="70" rx="14" fill="#e5edf3"/>
  <text x="85" y="1025" class="rel">PK = clave primaria · FK = clave foránea · UQ = valor único · N:M se resolvió con tabla puente.</text>
  <text x="85" y="1050" class="small">Los índices y restricciones se definieron en database/schema.sql; las relaciones de actores se agregaron en la migración del Sprint 2.</text>
</svg>
